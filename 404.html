  <script>
    /* GitHub Pages serves this page for any missing URL, at any depth.
       Set a <base> so relative links (assets/, index.html) still resolve to the site root.
       Project sites (user.github.io/repo-name/) use "/repo-name/"; custom domains use "/". */
    (function () {
      if (location.protocol === "file:") return;
      var base = "/";
      var parts = location.pathname.split("/");
      if (/\.github\.io$/i.test(location.hostname) && parts.length > 2 && parts[1]) base = "/" + parts[1] + "/";
      document.write('<base href="' + base + '">');
    })();
    document.documentElement.classList.add("js");
  </script>
